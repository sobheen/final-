<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClaimsDesk · WhatsApp Document Tracker</title>
<style>
:root{--ink:#17302f;--paper:#eef2ef;--card:#fff;--line:#d5ded9;--teal:#0e7a6b;--red:#c2392f;--amber:#b7791f;--mut:#5d716c}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 "Trebuchet MS","Segoe UI",sans-serif}
.m{max-width:1200px;margin:0 auto;padding:20px}header{display:flex;align-items:baseline;gap:14px}h1{font-size:26px;margin:0 0 14px;letter-spacing:-.4px}
.live{color:var(--teal);font-weight:700;font-size:13px}h2{font-size:15px;margin:16px 0 8px}h2.big{font-size:22px;margin:0}small{color:var(--mut);display:block;font-size:12.5px}
.grid{display:grid;grid-template-columns:290px 1fr;gap:18px}@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.case{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;cursor:pointer;font:inherit;color:inherit}
.case.on{border-color:var(--teal);box-shadow:inset 4px 0 0 var(--teal)}
.bar{display:block;height:8px;background:#e3e9e6;border-radius:4px;margin:6px 0;overflow:hidden}.bar.lg{height:12px;margin:12px 0}.bar i{display:block;height:100%;background:var(--teal);transition:width .5s}
.sc{display:block;width:100%;text-align:left;padding:8px 10px;margin-bottom:6px;background:#fff;border:1px solid var(--line);border-radius:6px;cursor:pointer;font:inherit;color:inherit}.sc:hover:not(:disabled){border-color:var(--teal);background:#e8f4f1}.reset{color:var(--red);margin-top:10px}
.hint{color:var(--mut);font-size:12.5px;margin:0 0 8px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.top small{display:inline}
.pill{background:#e8f4f1;color:var(--teal);border-radius:20px;padding:5px 12px;font-weight:700;font-size:13px;white-space:nowrap}.pill.done{background:var(--teal);color:#fff}
.row{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}.row>div{flex:1}.row b{font-weight:600}
.ic{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;font-weight:800;color:#fff}.ic.ok{background:var(--teal)}.ic.no{background:var(--red)}.ic.resend{background:var(--amber)}
.tag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:5px}.tag.ok{background:#dff3e7;color:#1b7a46}.tag.no{background:#fbe3e0;color:var(--red)}.tag.resend{background:#fdf0d5;color:var(--amber)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:820px){.two{grid-template-columns:1fr}}
.ev{margin:0 0 4px;padding:6px 0 6px 10px;border-left:3px solid var(--line)}.ev.ok,.ev.merge{border-color:var(--teal)}.ev.blurry{border-color:var(--amber)}.ev.quarantine{border-color:var(--red);background:#fdf2f1}.ev.dup{border-color:#8a9a95}.ev.reply{border-color:#2f6fdb}
.wa{background:#e6efe4}.bub{background:#fff;border-radius:0 10px 10px 10px;padding:9px 12px;margin-bottom:8px;white-space:pre-wrap;font-size:14px}
</style></head><body><main class="m"><header><h1>ClaimsDesk Document Tracker</h1><span class="live">● live</span></header><div id="app">Loading…</div></main>
<script>
const REQ=[["kyc","KYC (Aadhaar / PAN)"],["policy","Policy copy / health card"],["discharge","Discharge summary"],["bill","Final hospital bill"],["reports","Investigation reports"],["consult","Consultation papers"],["pharmacy","Pharmacy bills"],["cheque","Cancelled cheque"]];
const P=(text,blurry)=>({text,blurry});
const T={discharge:"Discharge Summary. Patient: Ravi Kumar. Date of discharge 12/10",reports:"Pathology lab report haemoglobin. Patient: Ravi Kumar",consult:"OPD consultation prescription Dr Rao. Patient: Ravi Kumar",bill:"Final hospital bill room rent net payable. Patient: Ravi Kumar",policy:"Star Health e-card policy no 3321 member id. Patient: Ravi Kumar",kyc:"Aadhaar UIDAI Patient: Ravi Kumar",pharmacy:"Apollo Pharmacy batch no expiry tablet. Patient: Ravi Kumar",cheque:"Cancelled cheque IFSC MICR. Patient: Ravi Kumar"};
const SCEN=[
["Discharge summary PDF",[{filename:"Discharge_Summary.pdf",hash:"h-dis",pages:[P(T.discharge)]}]],
["Same file sent again",[{filename:"Discharge_Summary.pdf",hash:"h-dis",pages:[P(T.discharge)]}]],
["One PDF: reports + consults (6 pp)",[{filename:"Reports_and_consults.pdf",hash:"h-rc",pages:[P(T.reports),P(T.reports),P(T.reports),P(T.reports),P(T.consult),P(T.consult)]}]],
["Final bill as 3 photos",[1,2,3].map(n=>({filename:`bill_${n}.jpg`,hash:"h-b"+n,pages:[P(T.bill)]}))],
["Policy card photo",[{filename:"Policy_Star.jpg",hash:"h-pol",pages:[P(T.policy)]}]],
["Blurry Aadhaar photo",[{filename:"aadhaar.jpg",hash:"h-aad",pages:[P(T.kyc,true)]}]],
["Clear Aadhaar (resend)",[{filename:"aadhaar2.jpg",hash:"h-aad2",pages:[P(T.kyc)]}]],
["Someone else's pharmacy bill",[{filename:"bills.jpg",hash:"h-x",pages:[P(T.pharmacy.replace("Ravi Kumar","Suresh Patel"))]}]],
["Pharmacy bills",[{filename:"pharmacy.jpg",hash:"h-ph",pages:[P(T.pharmacy)]}]],
["Cancelled cheque",[{filename:"cheque.jpg",hash:"h-ch",pages:[P(T.cheque)]}]]];
let db=null,sel="919800000345",busy=false;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tm=t=>new Date(t*1000).toLocaleTimeString();
const count=c=>REQ.filter(([k])=>c.docs[k]&&c.docs[k].status==="ok").length;
async function pull(){db=await (await fetch("/api/state",{cache:"no-store"})).json();render()}
async function send(i){busy=true;await fetch("/api/simulate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({phone:sel,items:SCEN[i][1]})});busy=false;pull()}
async function reset(){await fetch("/api/state",{method:"DELETE"});pull()}
function pick(p){sel=p;render()}
function render(){
 const cases=Object.values(db.cases),c=db.cases[sel]||cases[0],ok=count(c);
 document.getElementById("app").innerHTML=`<div class="grid"><aside><h2>Cases</h2>
 ${cases.map(x=>`<button class="case ${x.phone===c.phone?"on":""}" onclick="pick('${x.phone}')"><b>${esc(x.name)}</b><small>${x.id} · +${x.phone.slice(0,2)} ${x.phone.slice(2,4)}xxx xx${x.phone.slice(-3)}</small><span class="bar"><i style="width:${count(x)/8*100}%"></i></span><small>${count(x)} of 8 received</small></button>`).join("")}
 <h2>Simulate WhatsApp</h2><p class="hint">Runs the same pipeline as live messages. Scenario files are written for Ravi Kumar.</p>
 ${SCEN.map((s,i)=>`<button class="sc" onclick="send(${i})">${esc(s[0])}</button>`).join("")}
 <button class="sc reset" onclick="reset()">Reset demo data</button></aside>
 <section><div class="card"><div class="top"><div><h2 class="big">${esc(c.name)} <small style="display:inline">Case ${c.id}</small></h2><small>+${c.phone} · updated ${tm(c.updated)}</small></div>
 <div class="pill ${ok===8?"done":""}">${ok===8?"COMPLETE, ready for insurer":ok+" of 8 received"}</div></div>
 <span class="bar lg"><i style="width:${ok/8*100}%"></i></span>
 ${REQ.map(([k,l])=>{const d=c.docs[k],s=d&&d.status;return `<div class="row"><span class="ic ${s||"no"}">${s==="ok"?"✓":s==="resend"?"!":"✗"}</span><div><b>${l}</b><small>${s==="ok"?esc(d.src):s==="resend"?"Blurry, needs resend":"not received"}</small></div><span class="tag ${s||"no"}">${s==="ok"?"Received":s==="resend"?"Needs resend":"MISSING"}</span></div>`}).join("")}</div>
 <div class="two"><div class="card"><h2>Activity</h2>${c.log.length?c.log.map(e=>`<p class="ev ${e.kind}"><small>${tm(e.t)}</small>${esc(e.msg)}</p>`).join(""):"<small>No documents yet. Pick a scenario on the left.</small>"}</div>
 <div class="card wa"><h2>Auto-replies to patient</h2>${c.chat.length?c.chat.map(m=>`<div class="bub">${esc(m.text)}</div>`).join(""):"<small>Replies appear here after each document.</small>"}</div></div></section></div>`}
pull();setInterval(pull,1500);
</script></body></html>
